name: Windows Installer Release

on:
  push:
    tags:
      - "v1.0.0*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install app dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the self-contained NSIS installer
        run: pnpm build:installer

      - name: Verify installer output
        shell: pwsh
        run: |
          $engine = Get-Item "src-tauri/resources/stockfish/stockfish.exe"
          if ($engine.Length -lt 50MB) {
            throw "Bundled Stockfish is unexpectedly small ($($engine.Length) bytes)."
          }
          $installer = "src-tauri/target/release/bundle/nsis/ChessReview_1.0.0_Setup.exe"
          if (!(Test-Path $installer)) {
            throw "Expected installer was not produced: $installer"
          }
          $file = Get-Item $installer
          if ($file.Length -lt 10MB) {
            throw "Installer is unexpectedly small ($($file.Length) bytes)."
          }
          Write-Output "Installer ready: $($file.FullName) ($($file.Length) bytes)"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChessReview_1.0.0_Setup-${{ github.ref_name }}
          path: src-tauri/target/release/bundle/nsis/ChessReview_1.0.0_Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish or update GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $title = "ChessReview $env:RELEASE_TAG"
          $notes = "Beta release for Windows. Download ChessReview_1.0.0_Setup.exe from Assets. Please report issues before general release."
          gh release view $env:RELEASE_TAG --repo $env:GH_REPO *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --repo $env:GH_REPO --title $title --notes $notes --prerelease --verify-tag
            if ($LASTEXITCODE -ne 0) { throw "Could not create GitHub prerelease for $env:RELEASE_TAG" }
          }
          gh release upload $env:RELEASE_TAG "src-tauri/target/release/bundle/nsis/ChessReview_1.0.0_Setup.exe" --repo $env:GH_REPO --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not upload installer to GitHub prerelease $env:RELEASE_TAG" }
          gh release edit $env:RELEASE_TAG --repo $env:GH_REPO --title $title --notes $notes --prerelease --draft=false
          if ($LASTEXITCODE -ne 0) { throw "Could not publish GitHub prerelease $env:RELEASE_TAG" }
